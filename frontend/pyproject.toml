[project]
name = "maranello-ai-frontend"
version = "0.1.0"
description = "Streamlit frontend for Maranello AI."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]