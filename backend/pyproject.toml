[project]
name = "maranello-ai-backend"
version = "0.1.0"
description = "Backend API for the Maranello AI enterprise knowledge assistant."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]